<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskbotStack - The Local AI & Companion Directory</title>
  <meta name="description" content="Curated index of local runtimes, low-latency voice engines, orchestration frameworks, and deskbot hardware." />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🤖</span>
        <span class="text-xl font-bold tracking-tight text-white">Deskbot<span class="text-indigo-400">Stack</span></span>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        25 Curated Tools
      </span>
    </div>
  </header>

  <!-- Hero -->
  <section class="max-w-6xl mx-auto px-6 pt-12 pb-8 text-center">
    <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight max-w-3xl mx-auto leading-tight">
      The Open Stack for <span class="text-indigo-400">Local AI & Physical Deskbots</span>
    </h1>
    <p class="mt-4 text-slate-400 max-w-2xl mx-auto text-base sm:text-lg">
      Compare offline LLM runtimes, low-latency voice engines, memory frameworks, and controller hardware.
    </p>
  </section>

  <!-- Filter Buttons -->
  <div class="max-w-6xl mx-auto px-6 mb-8 flex flex-wrap gap-2 justify-center">
    <button onclick="filterCat('all')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">All (25)</button>
    <button onclick="filterCat('runtimes')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">LLM Runtimes</button>
    <button onclick="filterCat('stt')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Hearing (STT)</button>
    <button onclick="filterCat('tts')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Voices (TTS)</button>
    <button onclick="filterCat('orchestration')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Memory & Agents</button>
    <button onclick="filterCat('hardware')" class="cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">Hardware & Controllers</button>
  </div>

  <!-- Cards Grid -->
  <main class="max-w-6xl mx-auto px-6 pb-24 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="grid"></main>

  <script>
    const tools = [
      { name: "Ollama", cat: "runtimes", role: "Brain / Core Inferencing API", price: "Free / MIT", runs: "Linux, macOS, Win, Docker", pro: "Instant model pulls, OpenAI-compatible background API", con: "CLI-first, needs Open-WebUI for chat", url: "https://ollama.com" },
      { name: "LM Studio", cat: "runtimes", role: "Brain / Model Testing GUI", price: "Free", runs: "macOS, Win, Linux", pro: "Polished GUI with built-in Hugging Face model downloader", con: "Closed source, heavier footprint", url: "https://lmstudio.ai" },
      { name: "llama.cpp", cat: "runtimes", role: "Raw C++ Inference Engine", price: "Free / MIT", runs: "Linux, macOS, Win, Pi", pro: "Extreme performance, sets the GGUF quantization standard", con: "Steep terminal compilation curve", url: "https://github.com/ggerganov/llama.cpp" },
      { name: "vLLM", cat: "runtimes", role: "High-Throughput Server", price: "Free / Apache 2", runs: "Linux, Docker", pro: "PagedAttention algorithm, blazing token throughput", con: "Needs high-end discrete NVIDIA/AMD GPU", url: "https://github.com/vllm-project/vllm" },
      { name: "Jan", cat: "runtimes", role: "Desktop AI Assistant", price: "Free / AGPLv3", runs: "Win, macOS, Linux", pro: "100% open-source local chat interface with clean modular plugins", con: "Fewer advanced quantization tuning knobs", url: "https://jan.ai" },
      { name: "LocalAI", cat: "runtimes", role: "All-in-One OpenAI Drop-in", price: "Free / MIT", runs: "Linux, Docker, Win, macOS", pro: "Unified server for LLM, audio generation, and TTS", con: "Complex multi-backend configuration", url: "https://localai.io" },
      { name: "Aphrodite Engine", cat: "runtimes", role: "Roleplay & Character Server", price: "Free / Apache 2", runs: "Linux, Docker", pro: "Tuned sampling algorithms for companions & roleplay", con: "Linux-only, needs discrete GPU", url: "https://github.com/PygmalionAI/aphrodite-engine" },
      { name: "faster-whisper", cat: "stt", role: "Hearing / Companion Ear", price: "Free / MIT", runs: "Linux, Win, macOS", pro: "Up to 4x faster than standard Whisper via CTranslate2", con: "Still requires decent RAM/CPU for large-v3", url: "https://github.com/SYSTRAN/faster-whisper" },
      { name: "Whisper.cpp", cat: "stt", role: "Edge Hearing / Embedded STT", price: "Free / MIT", runs: "Raspberry Pi, Linux, macOS", pro: "Pure C/C++ zero dependencies, runs smooth on ARM", con: "Needs external pipeline for streaming VAD", url: "https://github.com/ggerganov/whisper.cpp" },
      { name: "Vosk", cat: "stt", role: "Instant Wake-Word Listener", price: "Free / Apache 2", runs: "Raspberry Pi, ESP32, Linux", pro: "Tiny 50MB RAM footprint, near-zero wake word latency", con: "Lower conversational speech accuracy", url: "https://alphacephei.com/vosk/" },
      { name: "Whisper-Live", cat: "stt", role: "Real-Time WebSocket Stream", price: "Free / MIT", runs: "Linux, Docker", pro: "Continuous low-latency audio stream transcription", con: "Requires fine audio buffer calibration", url: "https://github.com/collabora/WhisperLive" },
      { name: "Piper TTS", cat: "tts", role: "Voice / Speech Synthesis", price: "Free / MIT", runs: "Raspberry Pi, Linux, Win", pro: "Generates high quality audio locally even on Pi 4/5 CPUs", con: "Voice cloning pipeline is involved", url: "https://github.com/rhasspy/piper" },
      { name: "Kokoro TTS", cat: "tts", role: "Studio-Grade Natural Voice", price: "Free / Apache 2", runs: "Linux, Win, macOS, Docker", pro: "Compact 82M model with near commercial-grade cadence", con: "Non-English voices still expanding", url: "https://huggingface.co/hexgrad/Kokoro-82M" },
      { name: "XTTS v2", cat: "tts", role: "Instant Voice Cloning", price: "Free / CPML", runs: "Linux, Win", pro: "Clones any voice using a 3-second sample across 17 languages", con: "Requires 4GB+ dedicated GPU VRAM", url: "https://github.com/coqui-ai/TTS" },
      { name: "StyleTTS 2", cat: "tts", role: "Expressive Human Prosody", price: "Free / MIT", runs: "Linux, Windows", pro: "Natural emotional pauses, breaths, and natural cadence", con: "Complex setup dependencies", url: "https://github.com/yl4579/StyleTTS2" },
      { name: "Bark", cat: "tts", role: "Laughs & Expressive Audio", price: "Free / MIT", runs: "Linux, Windows", pro: "Can laugh, sigh, hesitate, and produce environmental audio", con: "Slow inference, prone to hallucinations", url: "https://github.com/suno-ai/bark" },
      { name: "Letta (MemGPT)", cat: "orchestration", role: "Persistent Long-Term Memory", price: "Free / Apache 2", runs: "Linux, macOS, Docker", pro: "Multi-tiered memory keeps your companion's memory forever", con: "Memory lookups increase token spend", url: "https://github.com/letta-ai/letta" },
      { name: "ElizaOS", cat: "orchestration", role: "Character & Social Agent", price: "Free / MIT", runs: "Node.js, Linux, Docker", pro: "Built-in voice, Twitter, Discord connectors + character cards", con: "Rapidly updating repository", url: "https://github.com/elizaos/eliza" },
      { name: "AutoGen", cat: "orchestration", role: "Multi-Agent Conversation", price: "Free / MIT", runs: "Python, Linux, Win", pro: "Coordinates multi-specialist bot conversations", con: "Can loop compute if prompts are loose", url: "https://github.com/microsoft/autogen" },
      { name: "LangChain", cat: "orchestration", role: "Tool & Sensor Calling", price: "Free / MIT", runs: "Python, TypeScript", pro: "Massive hardware sensor, vector, and API library", con: "Heavy abstraction layer", url: "https://www.langchain.com" },
      { name: "Raspberry Pi 5 (8GB)", cat: "hardware", role: "Physical Edge Controller", price: "~$80 USD", runs: "Raspberry Pi OS (Linux)", pro: "Camera/mic ports, active GPIO header ecosystem", con: "Underpowered for standalone 8B LLMs", url: "https://www.raspberrypi.com/products/raspberry-pi-5/" },
      { name: "Beelink SER8 (Ryzen 7)", cat: "hardware", role: "Dedicated Local AI Server", price: "~$550-$650", runs: "Linux Mint, Win 11", pro: "Radeon 780M iGPU with fast dual-channel DDR5 for 8B/14B", con: "SODIMM RAM bandwidth limit vs Apple Silicon", url: "https://www.bee-link.com" },
      { name: "Mac Mini M4 (24GB)", cat: "hardware", role: "Unified Memory Brain", price: "~$799 USD", runs: "macOS", pro: "120GB/s unified bandwidth runs 14B-32B whisper quiet", con: "No post-purchase RAM upgrades", url: "https://www.apple.com/mac-mini/" },
      { name: "ESP32-S3 Dev Board", cat: "hardware", role: "Motor & Sensor Microcontroller", price: "~$5-$10 USD", runs: "MicroPython, C++", pro: "Wi-Fi, Bluetooth 5, tiny form factor, vector wake words", con: "8MB PSRAM cannot run large LLMs", url: "https://www.espressif.com/en/products/socs/esp32-s3" },
      { name: "PCA9685 Servo Driver", cat: "hardware", role: "Head & Neck Articulation", price: "~$6-$12 USD", runs: "I2C (Pi, ESP32)", pro: "Drives 16 servos smoothly using only 2 I2C pins", con: "Needs dedicated 5V power supply rail", url: "https://www.adafruit.com/product/815" }
    ];

    const grid = document.getElementById('grid');

    function render(items) {
      grid.innerHTML = items.map(t => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-white">${t.name}</h3>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${t.price}</span>
            </div>
            <p class="text-xs font-medium text-indigo-400 mb-3">${t.role}</p>
            <div class="space-y-1.5 text-xs text-slate-300">
              <p><strong class="text-slate-400">Platform:</strong> ${t.runs}</p>
              <p><strong class="text-emerald-400">Pro:</strong> ${t.pro}</p>
              <p><strong class="text-rose-400">Con:</strong> ${t.con}</p>
            </div>
          </div>
          <div class="mt-5 pt-4 border-t border-slate-800/80">
            <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="block text-center w-full py-2 px-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition">
              Open Tool / Specs &rarr;
            </a>
          </div>
        </div>
      `).join('');
    }

    function filterCat(cat) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = 'cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700';
      });
      event.target.className = 'cat-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white';
      if (cat === 'all') {
        render(tools);
      } else {
        render(tools.filter(t => t.cat === cat));
      }
    }

    render(tools);
  </script>
</body>
</html>
